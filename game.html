<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Drift</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    height:100%; overflow:hidden;
    background:#05060e;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color:#e8f0ff;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #wrap {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  canvas {
    display:block;
    max-width:100%; max-height:100%;
    touch-action:none;
    box-shadow:0 0 80px rgba(80,140,255,.15);
  }
  .overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background:radial-gradient(ellipse at center, rgba(10,14,30,.72), rgba(3,4,10,.94));
    backdrop-filter:blur(3px);
    transition:opacity .25s;
  }
  .overlay.hidden { opacity:0; pointer-events:none; }
  h1 {
    font-size:clamp(34px,8vw,68px);
    font-weight:800; letter-spacing:.16em;
    background:linear-gradient(90deg,#43e0ff,#7d6bff 45%,#ff5fa8);
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    text-shadow:0 0 40px rgba(90,150,255,.35);
    margin-bottom:6px;
  }
  .sub {
    font-size:clamp(11px,2.6vw,14px);
    letter-spacing:.34em; text-transform:uppercase;
    color:#7f8cb8; margin-bottom:26px;
  }
  .keys {
    display:flex; flex-wrap:wrap; gap:8px 18px;
    justify-content:center; max-width:520px;
    margin-bottom:28px; font-size:13px; color:#93a2cc;
  }
  .keys b {
    display:inline-block; min-width:26px; padding:2px 8px;
    border:1px solid #2f3d63; border-radius:6px;
    background:#141a2e; color:#cfe0ff;
    font-weight:600; font-size:12px;
  }
  button {
    cursor:pointer; border:none; border-radius:999px;
    padding:14px 44px;
    font-size:16px; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; color:#04060f;
    background:linear-gradient(135deg,#4be2ff,#8b7bff);
    box-shadow:0 0 34px rgba(90,160,255,.5), 0 6px 24px rgba(0,0,0,.5);
    transition:transform .14s, box-shadow .14s, filter .14s;
  }
  button:hover { transform:translateY(-2px) scale(1.03); filter:brightness(1.1); }
  button:active { transform:translateY(0) scale(.98); }
  .score-final {
    font-size:15px; color:#9fb0dd; letter-spacing:.1em;
    margin-bottom:22px; line-height:2;
  }
  .score-final span { color:#5ce6ff; font-weight:700; font-size:22px; }
  .hint { margin-top:18px; font-size:11px; letter-spacing:.2em; color:#5a6790; text-transform:uppercase; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div class="overlay" id="startScreen">
    <h1>NEON DRIFT</h1>
    <div class="sub">Gravity&nbsp;·&nbsp;Momentum&nbsp;·&nbsp;Survive</div>
    <div class="keys">
      <div><b>A</b> / <b>D</b> &nbsp;thrust</div>
      <div><b>W</b> / <b>S</b> &nbsp;climb / dive</div>
      <div><b>←→↑↓</b> &nbsp;alternate</div>
      <div><b>SHIFT</b> &nbsp;boost</div>
      <div><b>SPACE</b> &nbsp;pause</div>
    </div>
    <button id="startBtn">Launch</button>
    <div class="hint">Tap &amp; drag on mobile · Collect orbs · Dodge debris</div>
  </div>

  <div class="overlay hidden" id="overScreen">
    <h1>WRECKED</h1>
    <div class="score-final" id="finalStats"></div>
    <button id="retryBtn">Retry</button>
    <div class="hint">Press <b style="color:#cfe0ff">R</b> or click to fly again</div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('startScreen');
  const overScreen  = document.getElementById('overScreen');
  const finalStats  = document.getElementById('finalStats');

  // ---------- Sizing ----------
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.min(window.innerWidth, 1280);
    H = Math.min(window.innerHeight, 860);
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ---------- Input ----------
  const keys = Object.create(null);
  const pressed = Object.create(null);   // one-shot edge detection
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (!keys[k]) pressed[k] = true;
    keys[k] = true;
    if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  // Mouse / touch steering
  let pointer = { active:false, x:0, y:0 };
  function ptr(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    if (!t) return;
    pointer.x = (t.clientX - r.left) * (W / r.width);
    pointer.y = (t.clientY - r.top ) * (H / r.height);
  }
  canvas.addEventListener('pointerdown', e => { pointer.active = true; ptr(e); });
  canvas.addEventListener('pointermove', e => { if (pointer.active) ptr(e); });
  window.addEventListener('pointerup',   () => pointer.active = false);
  window.addEventListener('pointercancel',() => pointer.active = false);

  const down = k => !!keys[k];
  const takePress = k => { const v = !!pressed[k]; pressed[k] = false; return v; };

  // ---------- Audio (tiny WebAudio blips) ----------
  let actx = null;
  function beep(freq, dur, type='sine', vol=0.05, slideTo) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, actx.currentTime + dur);
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  // ---------- Game state ----------
  const STATE = { MENU:0, PLAY:1, PAUSE:2, OVER:3 };
  let state = STATE.MENU;

  const GRAV     = 0.028;
  const THRUST   = 0.052;
  const DRAG     = 0.986;
  const MAXSPD   = 5.6;
  const P_RADIUS = 12;

  let player, rocks, orbs, particles, stars;
  let score, best = 0, elapsed, spawnTimer, orbTimer, shake, boostFuel, combo, comboTimer;
  let scrollY = 0;

  function makeStars() {
    stars = [];
    for (let i = 0; i < 140; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z: 0.25 + Math.random() * 0.9,
        r: 0.4 + Math.random() * 1.5
      });
    }
  }

  function reset() {
    player = { x: W * 0.5, y: H * 0.5, vx: 0, vy: 0, angle: -Math.PI/2, alive: true, trail: [] };
    rocks = []; orbs = []; particles = [];
    score = 0; elapsed = 0; spawnTimer = 0; orbTimer = 0;
    shake = 0; boostFuel = 100; combo = 0; comboTimer = 0;
    makeStars();
  }

  // ---------- Spawning ----------
  function spawnRock(forcedRadius) {
    const r = forcedRadius || (14 + Math.random() * 26);
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = Math.random() * W; y = -r - 10; }
    else if (edge === 1) { x = W + r + 10; y = Math.random() * H; }
    else if (edge === 2) { x = Math.random() * W; y = H + r + 10; }
    else               { x = -r - 10; y = Math.random() * H; }

    // Aim roughly at the player so it's fair but threatening
    const ang = Math.atan2(player.y - y, player.x - x) + (Math.random() - 0.5) * 0.9;
    const spd = 1.1 + Math.random() * 1.6 + elapsed * 0.006;

    const verts = [];
    const n = 7 + Math.floor(Math.random() * 5);
    for (let i = 0; i < n; i++) verts.push(0.72 + Math.random() * 0.46);

    rocks.push({
      x, y, r, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.05,
      verts, hp: r > 28 ? 2 : 1,
      hue: Math.random() < 0.25 ? 320 : 205
    });
  }

  function spawnOrb() {
    const m = 46;
    orbs.push({
      x: m + Math.random() * (W - m * 2),
      y: m + Math.random() * (H - m * 2),
      r: 7, life: 1, pulse: Math.random() * Math.PI * 2
    });
  }

  function burst(x, y, hue, count, power) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = Math.random() * power;
      particles.push({
        x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
        life: 1, decay: 0.012 + Math.random()*0.022,
        r: 1 + Math.random()*2.6, hue
      });
    }
  }

  // ---------- Update ----------
  function update(dt) {
    elapsed += dt;
    scrollY += 0.35;

    // stars drift
    for (const s of stars) {
      s.x -= 0.12 * s.z * (player ? 1 + Math.abs(player.vx)*0.16 : 1);
      s.y += 0.05 * s.z;
      if (s.x < -3) s.x = W + 3;
      if (s.y > H + 3) s.y = -3;
      if (s.x > W + 3) s.x = -3;
    }

    if (state !== STATE.PLAY) return;

    // ---- Player control ----
    let ax = 0, ay = GRAV;
    const boost = down('shift');
    const thr = boost ? THRUST * 1.9 : THRUST;

    if (down('a') || down('arrowleft'))  ax -= thr;
    if (down('d') || down('arrowright')) ax += thr;
    if (down('w') || down('arrowup'))    ay -= thr;
    if (down('s') || down('arrowdown'))  ay += thr;

    if (boost && boostFuel > 0 && (ax || ay !== GRAV)) {
      boostFuel = Math.max(0, boostFuel - dt * 0.09);
    } else {
      boostFuel = Math.min(100, boostFuel + dt * 0.035);
    }

    if (pointer.active) {
      const dx = pointer.x - player.x, dy = pointer.y - player.y;
      const d = Math.hypot(dx, dy);
      if (d > 6) { ax += (dx / d) * thr * 1.3; ay += (dy / d) * thr * 1.3; }
    }

    player.vx = (player.vx + ax) * DRAG;
    player.vy = (player.vy + ay) * DRAG;
    const spd = Math.hypot(player.vx, player.vy);
    if (spd > MAXSPD * (boost ? 1.5 : 1)) {
      const k = (MAXSPD * (boost ? 1.5 : 1)) / spd;
      player.vx *= k; player.vy *= k;
    }
    player.x += player.vx * dt;
    player.y += player.vy * dt;

    // soft world bounds
    const pad = P_RADIUS;
    if (player.x < pad)     { player.x = pad;     player.vx = Math.abs(player.vx) * 0.5; }
    if (player.x > W - pad) { player.x = W - pad; player.vx = -Math.abs(player.vx) * 0.5; }
    if (player.y < pad)     { player.y = pad;     player.vy = Math.abs(player.vy) * 0.5; }
    if (player.y > H - pad) { player.y = H - pad; player.vy = -Math.abs(player.vy) * 0.5; }

    // ship faces velocity
    if (spd > 0.28) player.angle = Math.atan2(player.vy, player.vx);

    player.trail.push({ x: player.x, y: player.y, a: 1 });
    if (player.trail.length > 18) player.trail.shift();
    for (const t of player.trail) t.a *= 0.9;

    // ---- Combo decay ----
    if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }

    // ---- Spawns ----
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const rate = Math.max(18, 62 - elapsed * 0.55);
      spawnTimer = rate * (0.6 + Math.random() * 0.8);
      spawnRock();
      if (elapsed > 14 && Math.random() < 0.35) spawnRock();
    }
    orbTimer -= dt;
    if (orbTimer <= 0) { orbTimer = 150 + Math.random() * 130; spawnOrb(); }

    // ---- Rocks ----
    for (let i = rocks.length - 1; i >= 0; i--) {
      const r = rocks[i];
      r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.vrot * dt;

      // gentle screen-wrap so nothing gets stranded
      const m = r.r + 60;
      if (r.x < -m || r.x > W + m || r.y < -m || r.y > H + m) {
        if (elapsed > 3) { rocks.splice(i, 1); }
        continue;
      }

      // collision with player
      const dx = r.x - player.x, dy = r.y - player.y;
      const rr = r.r * 0.86 + P_RADIUS;
      if (dx*dx + dy*dy < rr*rr) {
        if (boost && spd > 3.4 && r.hp === 1) {
          // boosted ram shatters small rocks
          burst(r.x, r.y, r.hue, 22, 4.5);
          beep(180, 0.16, 'square', 0.06, 60);
          score += 25;
          rocks.splice(i, 1);
          shake = Math.max(shake, 8);
          continue;
        }
        gameOver();
        return;
      }

      // rock vs rock bounce for lively chaos
      for (let j = i - 1; j >= 0; j--) {
        const o = rocks[j];
        const ddx = o.x - r.x, ddy = o.y - r.y;
        const min = (o.r + r.r) * 0.85;
        const d2 = ddx*ddx + ddy*ddy;
        if (d2 < min*min && d2 > 0.01) {
          const d = Math.sqrt(d2), nx = ddx/d, ny = ddy/d;
          const push = (min - d) * 0.5;
          r.x -= nx*push; r.y -= ny*push; o.x += nx*push; o.y += ny*push;
          const tx = r.vx, ty = r.vy;
          r.vx = o.vx*0.7 + nx*0.4; r.vy = o.vy*0.7 + ny*0.4;
          o.vx = tx*0.7 - nx*0.4;   o.vy = ty*0.7 - ny*0.4;
        }
      }
    }

    // ---- Orbs ----
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      o.life -= dt * 0.0016;
      o.pulse += dt * 0.12;
      if (o.life <= 0) { orbs.splice(i, 1); continue; }

      const dx = o.x - player.x, dy = o.y - player.y;
      const d2 = dx*dx + dy*dy;
      // magnet
      if (d2 < 150*150 && d2 > 4) {
        const d = Math.sqrt(d2);
        o.x -= (dx/d) * 1.4 * dt; o.y -= (dy/d) * 1.4 * dt;
      }
      if (d2 < (o.r + P_RADIUS + 3) ** 2) {
        combo++; comboTimer = 180;
        const gain = 10 * Math.min(combo, 8);
        score += gain;
        boostFuel = Math.min(100, boostFuel + 16);
        burst(o.x, o.y, 55, 16, 3.4);
        beep(520 + Math.min(combo,8)*70, 0.09, 'sine', 0.045, 900);
        orbs.splice(i, 1);
      }
    }

    // ---- Particles ----
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.985; p.vy *= 0.985;
      p.life -= p.decay * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 0.6);
    best = Math.max(best, Math.floor(score));
  }

  // ---------- Draw ----------
  function drawShip(x, y, angle, thrusting, boosting) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle + Math.PI/2);

    // exhaust
    if (thrusting) {
      const len = 14 + Math.random() * (boosting ? 16 : 9);
      const g = ctx.createLinearGradient(0, 12, 0, 12 + len);
      g.addColorStop(0, boosting ? 'rgba(120,230,255,.95)' : 'rgba(90,200,255,.9)');
      g.addColorStop(1, 'rgba(90,140,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-5, 11); ctx.lineTo(5, 11);
      ctx.lineTo(0, 12 + len);
      ctx.closePath(); ctx.fill();
    }

    // hull
    ctx.shadowColor = boosting ? 'rgba(120,230,255,.95)' : 'rgba(90,180,255,.85)';
    ctx.shadowBlur = 18;
    const hull = ctx.createLinearGradient(0, -16, 0, 14);
    hull.addColorStop(0, '#eaf4ff');
    hull.addColorStop(0.5, '#9ec8ff');
    hull.addColorStop(1, '#4a72d6');
    ctx.fillStyle = hull;
    ctx.beginPath();
    ctx.moveTo(0, -17);
    ctx.lineTo(9, 8);
    ctx.lineTo(3.5, 6);
    ctx.lineTo(0, 13);
    ctx.lineTo(-3.5, 6);
    ctx.lineTo(-9, 8);
    ctx.closePath();
    ctx.fill();

    // cockpit
    ctx.shadowBlur = 0;
    ctx.fillStyle = boosting ? '#bff4ff' : '#6fe3ff';
    ctx.beginPath(); ctx.arc(0, -5, 2.7, 0, Math.PI*2); ctx.fill();

    ctx.restore();
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // background
    const bg = ctx.createRadialGradient(W*0.5, H*0.42, 40, W*0.5, H*0.5, Math.max(W,H)*0.78);
    bg.addColorStop(0, '#101733');
    bg.addColorStop(0.55, '#080b18');
    bg.addColorStop(1, '#04050b');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // stars
    for (const s of stars) {
      ctx.globalAlpha = 0.25 + s.z * 0.6;
      ctx.fillStyle = s.z > 0.85 ? '#cfe4ff' : '#7f93c9';
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    // shake offset
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }

    // orbs
    for (const o of orbs) {
      const pr = o.r + Math.sin(o.pulse) * 1.8;
      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, pr*4);
      g.addColorStop(0, 'rgba(255,255,255,.95)');
      g.addColorStop(0.25, 'rgba(120,255,235,.85)');
      g.addColorStop(1, 'rgba(50,200,180,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(o.x, o.y, pr*4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#eafffb';
      ctx.beginPath(); ctx.arc(o.x, o.y, pr*0.52, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = Math.min(1, o.life * 2.2);
      ctx.globalAlpha = 1;
    }

    // rocks
    for (const r of rocks) {
      ctx.save();
      ctx.translate(r.x, r.y);
      ctx.rotate(r.rot);
      const n = r.verts.length;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        const rr = r.r * r.verts[i];
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();

      const rg = ctx.createRadialGradient(0, 0, r.r*0.15, 0, 0, r.r*1.15);
      if (r.hue === 320) {
        rg.addColorStop(0, '#5a2a44'); rg.addColorStop(1, '#2a1020');
      } else {
        rg.addColorStop(0, '#37446b'); rg.addColorStop(1, '#161d33');
      }
      ctx.fillStyle = rg; ctx.fill();

      ctx.strokeStyle = r.hue === 320 ? 'rgba(255,110,180,.85)' : 'rgba(110,180,255,.8)';
      ctx.lineWidth = 1.6;
      ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.restore();
    }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = `hsl(${p.hue}, 100%, ${55 + 25*p.life}%)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // player
    if (player && player.alive) {
      for (const t of player.trail) {
        ctx.globalAlpha = t.a * 0.5;
        ctx.fillStyle = 'rgba(110,210,255,.7)';
        ctx.beginPath(); ctx.arc(t.x, t.y, 3.4 * t.a, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      const thrusting = state === STATE.PLAY &&
        (down('w')||down('a')||down('s')||down('d')||
         down('arrowup')||down('arrowleft')||down('arrowdown')||down('arrowright')||
         pointer.active);
      drawShip(player.x, player.y, player.angle, thrusting, down('shift'));
    }

    ctx.restore();

    // ---- HUD ----
    if (state === STATE.PLAY || state === STATE.PAUSE) {
      ctx.font = '700 30px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = '#eaf4ff';
      ctx.shadowColor = 'rgba(90,180,255,.7)'; ctx.shadowBlur = 14;
      ctx.textAlign = 'left';
      ctx.fillText(String(Math.floor(score)), 22, 44);
      ctx.shadowBlur = 0;

      ctx.font = '600 11px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = '#7f8cb8';
      ctx.fillText('SCORE', 23, 62);
      ctx.textAlign = 'right';
      ctx.fillText('BEST ' + best, W - 22, 30);

      // combo
      if (combo > 1) {
        ctx.textAlign = 'right';
        ctx.fillStyle = '#5ce6ff';
        ctx.font = '700 16px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('x' + Math.min(combo,8) + ' COMBO', W - 22, 54);
      }

      // boost bar
      const bw = 118, bh = 6, bx = 22, by = H - 24;
      ctx.fillStyle = 'rgba(255,255,255,.10)';
      roundRect(bx, by, bw, bh, 3); ctx.fill();
      const bg2 = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      bg2.addColorStop(0, '#4be2ff'); bg2.addColorStop(1, '#8b7bff');
      ctx.fillStyle = bg2;
      roundRect(bx, by, bw * (boostFuel/100), bh, 3); ctx.fill();
      ctx.fillStyle = '#6d7ba5';
      ctx.font = '600 10px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('BOOST', bx, by - 6);

      // time
      ctx.textAlign = 'right';
      ctx.fillStyle = '#5a6790';
      ctx.fillText(Math.floor(elapsed/60) + ':' + String(Math.floor(elapsed%60)).padStart(2,'0'), W - 22, H - 18);

      if (state === STATE.PAUSE) {
        ctx.fillStyle = 'rgba(4,6,15,.6)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#eaf4ff';
        ctx.font = '800 44px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('PAUSED', W/2, H/2);
        ctx.font = '500 13px "Segoe UI", system-ui, sans-serif';
        ctx.fillStyle = '#7f8cb8';
        ctx.fillText('press SPACE to resume', W/2, H/2 + 32);
      }
    }
  }

  function roundRect(x, y, w, h, r) {
    if (w < r*2) r = w/2;
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
  }

  // ---------- Flow ----------
  function startGame() {
    resize();
    reset();
    state = STATE.PLAY;
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    beep(320, 0.12, 'triangle', 0.05, 640);
  }

  function gameOver() {
    state = STATE.OVER;
    player.alive = false;
    burst(player.x, player.y, 15, 46, 7);
    shake = 20;
    beep(300, 0.5, 'sawtooth', 0.07, 40);
    finalStats.innerHTML =
      `SCORE&nbsp; <span>${Math.floor(score)}</span><br>` +
      `BEST&nbsp; <span>${best}</span> &nbsp;·&nbsp; SURVIVED ${Math.floor(elapsed)}s`;
    setTimeout(() => overScreen.classList.remove('hidden'), 450);
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);

  // ---------- Loop ----------
  let last = 0;
  function loop(ts) {
    if (!last) last = ts;
    let dt = (ts - last) / 16.6667;
    last = ts;
    dt = Math.min(dt, 2.5);

    if (takePress(' ') && state === STATE.PLAY) state = STATE.PAUSE;
    else if (takePress(' ') && state === STATE.PAUSE) state = STATE.PLAY;

    if ((takePress('r')) && (state === STATE.OVER || state === STATE.MENU)) {
      startGame();
    }

    if (state === STATE.OVER) {
      // let particles settle visually
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt * 0.6; p.y += p.vy * dt * 0.6;
        p.vx *= 0.97; p.vy *= 0.97;
        p.life -= p.decay * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      if (shake > 0) shake = Math.max(0, shake - dt * 0.5);
    } else {
      update(dt);
    }

    render();
    requestAnimationFrame(loop);
  }

  resize();
  makeStars();
  player = { x: W*0.5, y: H*0.5, vx:0, vy:0, angle:-Math.PI/2, alive:true, trail:[] };
  rocks = []; orbs = []; particles = [];
  score = 0; elapsed = 0; spawnTimer = 0; orbTimer = 0; shake = 0;
  boostFuel = 100; combo = 0; comboTimer = 0;
  requestAnimationFrame(loop);
})();
</script>
</body>
